<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Prey review entry splash</title>
  <desc id="desc">A dark orbital station dossier graphic with amber light, glass arcs, and a hostile mimic signal.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020407"/>
      <stop offset="0.42" stop-color="#071018"/>
      <stop offset="1" stop-color="#020304"/>
    </linearGradient>
    <radialGradient id="amber-core" cx="56%" cy="42%" r="44%">
      <stop offset="0" stop-color="#ffb23c" stop-opacity="0.58"/>
      <stop offset="0.36" stop-color="#ce6e1b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0d19b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0d19b" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#f0d19b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
