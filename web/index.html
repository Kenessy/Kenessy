<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apocalypse Express</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="lobby">
  <div class="lobby-wrap">
    <h1>APOCALYPSE EXPRESS</h1>
    <p class="sub">A Dead Soul's Second Chance</p>
    <div class="form">
      <input id="name" type="text" placeholder="Your name..." maxlength="20">
      <input id="code" type="text" placeholder="Session code (e.g. AE-0042)" maxlength="10">
      <div class="row">
        <button onclick="join('player')">Board the Train</button>
        <button class="secondary" onclick="join('dm')">Conductor's Booth</button>
      </div>
    </div>
  </div>
  <script src="js/db.js"></script>
  <script>
    function join(role) {
      const name = document.getElementById('name').value.trim();
      const code = (document.getElementById('code').value.trim() || 'AE-' + Math.floor(1000 + Math.random() * 9000)).toUpperCase();
      if (!name) { alert('Enter your name.'); return; }
      sessionStorage.setItem('ae_name', name);
      sessionStorage.setItem('ae_session', code);
      sessionStorage.setItem('ae_role', role);
      window.location.href = role === 'dm' ? 'dm.html' : 'game.html';
    }
  </script>
</body>
</html>
